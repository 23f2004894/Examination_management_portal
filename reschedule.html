{% extends 'base.html' %}{% block body %}<a href="{{url_for('my_bookings')}}">← Bookings</a><h1>Reschedule booking #{{booking.id}}</h1><p>{{booking.student_name}} — {{booking.title}}</p><div class="card"><div class="card-body"><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label class="form-label">Select another slot in the same examination</label><select name="slot_id" class="form-select mb-3">{% for s in choices %}<option value="{{s.id}}" {% if s.id==booking.slot_id %}selected{% endif %} {% if s.taken>=s.capacity and s.id!=booking.slot_id %}disabled{% endif %}>#{{s.id}}: {{s.slot_date}} {{s.start_time}} — {{s.examiner_name}} ({{s.capacity-s.taken}} seats)</option>{% endfor %}</select><button class="btn btn-primary">Reschedule booking</button></form></div></div>{% endblock %}

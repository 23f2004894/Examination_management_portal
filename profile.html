{% extends 'base.html' %}{% block body %}<h1>My profile</h1><div class="card"><div class="card-body"><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label class="form-label">Name</label><input name="name" class="form-control mb-3" value="{{me.name}}" required><label class="form-label">Department</label><input name="department" class="form-control mb-3" value="{{me.department}}"><label class="form-label">Email (read-only)</label><input class="form-control mb-3" value="{{me.email}}" disabled><button class="btn btn-primary">Save profile</button></form></div></div>{% endblock %}

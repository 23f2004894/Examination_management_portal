{% extends 'base.html' %}{% block body %}<h1>Courses</h1><div class="card mb-4"><div class="card-body"><h4>{{'Edit course' if edit else 'Add a new course'}}</h4><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input type="hidden" name="id" value="{{edit.id if edit else ''}}"><div class="row g-3">
<div class="col-md-3"><label class="form-label">Code</label><input name="code" required class="form-control" value="{{edit.code if edit else ''}}"></div><div class="col-md-4"><label class="form-label">Name</label><input name="name" required class="form-control" value="{{edit.name if edit else ''}}"></div><div class="col-md-3"><label class="form-label">Status</label><select name="active" class="form-select"><option value="1" {% if not edit or edit.active %}selected{% endif %}>Active</option><option value="0" {% if edit and not edit.active %}selected{% endif %}>Inactive</option></select></div>
<div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2">{{edit.description if edit else ''}}</textarea></div></div><button class="btn btn-primary mt-3">Save course</button></form></div></div>
<div class="card table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Code</th><th>Course</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for c in items %}<tr><td>{{c.id}}</td><td>{{c.code}}</td><td>{{c.name}}</td><td>{{'Active' if c.active else 'Inactive'}}</td><td class="d-flex gap-2"><a class="btn btn-outline-primary btn-sm" href="{{url_for('courses',edit=c.id)}}">Edit</a><form method="post" action="{{url_for('delete_course',cid=c.id)}}"><input type="hidden" name="_csrf" value="{{csrf_token}}"><button class="btn btn-outline-danger btn-sm">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">Add your first course above.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
